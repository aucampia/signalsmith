# https://taskfile.dev/usage/
# https://pkg.go.dev/text/template
# https://go-task.github.io/slim-sprig/
#
version: "3"
vars:
  PYTHON: python3
  RUN_PREFIX: "uv run"
  RUN_PYTHON: "{{.RUN_PREFIX}} python"
  PY_SOURCE: "src tests devtools"
  YAML_SOURCE: "Taskfile.yml docker-compose.yaml .github/workflows"
  SH_FILES:
    sh: git -c safe.directory='*' ls-files -- '*.sh'
  MD_FILES:
    sh: git -c safe.directory='*' ls-files -- '*.md' ':!:.opencode/*'
  # Command bodies shared by a tool's check and fix task. Kept here rather
  # than having one task call the other because CHECK_RUN_PREFIX embeds
  # {{.TASK}}, and a delegating task would report the callee's name.
  RUFF_FORMAT: "{{.RUN_PREFIX}} ruff format --config pyproject.toml"
  RUFF_LINT: "{{.RUN_PREFIX}} ruff check --config pyproject.toml"
  YAMLFMT: "mise exec -- yamlfmt"
  SHFMT: "mise exec -- shfmt"
  RUMDL: "mise exec -- rumdl"
  # Empty outside GitHub Actions, so local runs are unaffected. {{.TASK}}
  # resolves to the currently-executing task because task injects its
  # special vars before templating vars like this one. Plain python3, not
  # RUN_PYTHON/`uv run`, so it works before `uv sync` (see gha-check-run.py).
  CHECK_RUN_PREFIX: >-
    {{if env "GITHUB_ACTIONS"}}{{.PYTHON}} devtools/gha-check-run.py run --data {{(dict "task" .TASK) | mustToJson | q}} --{{end}}
  STATIC_CHECKS: >-
    mypy codespell ruff:format:check ruff:lint yamlfmt shfmt shellcheck rumdl:format:check rumdl:check
  STATIC_FIXES: >-
    ruff:lint:fix ruff:format:fix yamlfmt:fix shfmt:fix rumdl:format:fix rumdl:check:fix
  VALIDATE_TASKS: "validate:static test examples:test"
  # Sequential by default; CI sets this so every tool runs (and so reports
  # its own check run) even after an earlier one fails.
  VALIDATE_PARALLEL: '{{env "VALIDATE_PARALLEL"}}'
  # Exactly one of each pair is non-empty. An empty `for` var expands to zero
  # iterations, so the unused branch disappears entirely.
  STATIC_DEPS: '{{if eq .VALIDATE_PARALLEL "true"}}{{.STATIC_CHECKS}}{{end}}'
  STATIC_CMDS: '{{if eq .VALIDATE_PARALLEL "true"}}{{else}}{{.STATIC_CHECKS}}{{end}}'
  VALIDATE_DEPS: '{{if eq .VALIDATE_PARALLEL "true"}}{{.VALIDATE_TASKS}}{{end}}'
  VALIDATE_CMDS: '{{if eq .VALIDATE_PARALLEL "true"}}{{else}}{{.VALIDATE_TASKS}}{{end}}'
tasks:
  configure:
    desc: Configure this project
    cmds:
      # mise (task/yamlfmt/shfmt/shellcheck/uv) must be installed before uv
      # itself can be invoked.
      - "mise install"
      - "uv sync {{.CLI_ARGS}}"
  update:
    desc: Update dependencies
    cmds:
      - uv lock --upgrade {{.CLI_ARGS}}
  update:ranges:
    desc: Update dependency ranges
    env:
      SCRIPT: |
        import re, subprocess, tomllib

        def pkg_name(spec):
            return re.split(r"[><=~!@;]", spec)[0]

        with open("pyproject.toml", "rb") as f:
            data = tomllib.load(f)

        groups = []
        deps = [pkg_name(d) for d in data.get("project", {}).get("dependencies", [])]
        if deps:
            groups.append((None, deps))
        for group, pkgs in data.get("dependency-groups", {}).items():
            group_deps = [pkg_name(p) for p in pkgs if isinstance(p, str)]
            if group_deps:
                groups.append((group, group_deps))

        for group, pkgs in groups:
            args = ["--group", group] if group else []
            subprocess.run(["uv", "remove"] + args + pkgs, check=True)
            subprocess.run(["uv", "add", "--bounds=major"] + args + pkgs, check=True)
    cmds:
      - uv run python -c "$SCRIPT"
  ruff:format:check:
    desc: Check Python formatting with ruff
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUFF_FORMAT}} --check --diff {{.CLI_ARGS | default .PY_SOURCE}}"
  ruff:format:fix:
    desc: Format Python with ruff
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUFF_FORMAT}} {{.CLI_ARGS | default .PY_SOURCE}}"
  ruff:lint:
    desc: Run ruff linter
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUFF_LINT}} {{.CLI_ARGS | default .PY_SOURCE}}"
  ruff:lint:fix:
    desc: Run ruff linter with autofix
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUFF_LINT}} --fix-only {{.CLI_ARGS | default .PY_SOURCE}}"
  mypy:
    desc: Run mypy
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUN_PYTHON}} -m mypy --show-error-context --show-error-codes {{.CLI_ARGS}}"
  codespell:
    desc: Run codespell
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUN_PREFIX}} codespell {{.CLI_ARGS | default .PY_SOURCE}}"
  yamlfmt:
    desc: Check YAML formatting
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.YAMLFMT}} -lint {{.CLI_ARGS | default .YAML_SOURCE}}"
  yamlfmt:fix:
    desc: Format YAML
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.YAMLFMT}} {{.CLI_ARGS | default .YAML_SOURCE}}"
  # shfmt/shellcheck/rumdl:*: the file list comes from a var rather than an
  # inline `files=$(...); if [ -n "$files" ]; then ...; fi` block because
  # CHECK_RUN_PREFIX can only wrap a single command line; status: skips the
  # task the same way the old `if` guard did; catLines flattens the
  # newline-separated file list so it doesn't split the templated command
  # line into multiple invalid ones.
  shfmt:
    desc: Check shell script formatting
    status:
      - '[ -z "{{.SH_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.SHFMT}} -l -d {{.SH_FILES | catLines}}"
  shfmt:fix:
    desc: Format shell scripts
    status:
      - '[ -z "{{.SH_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.SHFMT}} -w {{.SH_FILES | catLines}}"
  shellcheck:
    desc: Run shellcheck
    status:
      - '[ -z "{{.SH_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} mise exec -- shellcheck {{.SH_FILES | catLines}}"
  rumdl:check:
    desc: Run rumdl markdown linter
    status:
      - '[ -z "{{.MD_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUMDL}} check {{.MD_FILES | catLines}}"
  rumdl:check:fix:
    desc: Run rumdl markdown linter with autofix
    status:
      - '[ -z "{{.MD_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUMDL}} check --fix {{.MD_FILES | catLines}}"
  rumdl:format:check:
    desc: Check markdown formatting with rumdl
    status:
      - '[ -z "{{.MD_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUMDL}} fmt --check {{.MD_FILES | catLines}}"
  rumdl:format:fix:
    desc: Format markdown with rumdl
    status:
      - '[ -z "{{.MD_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUMDL}} fmt {{.MD_FILES | catLines}}"
  license:fetch:
    desc: Fetch the canonical CC0-1.0 license text into LICENSE
    cmds:
      - uvx reuse download -o LICENSE CC0-1.0
  pip-audit:
    desc: Run pip audit
    cmds:
      - |
        uv export --all-groups --no-emit-project --format requirements.txt | \
          {{.RUN_PYTHON}} -m pip_audit --requirement /dev/stdin --no-deps --strict --desc on
  test:
    desc: Run tests
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUN_PYTHON}} -m pytest {{.CLI_ARGS}}"
  examples:test:
    desc: Run example config tests via CLI
    env:
      SIGNALSMITH_CONFIG_DIR: examples
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUN_PREFIX}} signalsmith test"
  validate:static:
    desc: Perform static validation
    deps:
      - for: {var: STATIC_DEPS}
        task: "{{.ITEM}}"
    cmds:
      - for: {var: STATIC_CMDS}
        task: "{{.ITEM}}"
  validate:fix:
    desc: Fix auto-fixable validation errors.
    # Always sequential - fixer order matters (ruff:lint:fix before
    # ruff:format:fix, rumdl:format:fix before rumdl:check:fix).
    cmds:
      - for: {var: STATIC_FIXES}
        task: "{{.ITEM}}"
  validate:
    desc: Perform all validation
    deps:
      - for: {var: VALIDATE_DEPS}
        task: "{{.ITEM}}"
    cmds:
      - for: {var: VALIDATE_CMDS}
        task: "{{.ITEM}}"
  fix-and-validate:
    desc: Perform all validation
    cmds:
      - task: validate:fix
      - task: validate
  uv:clean:
    desc: Clean virtualenv
    cmds:
      - uv run --no-sync printenv VIRTUAL_ENV | xargs -t rm -rv
  clean:
    desc: Clean everything
    cmds:
      - task: _rimraf
        vars: {RIMRAF_TARGET: ".mypy_cache"}
      - task: _rimraf
        vars: {RIMRAF_TARGET: ".pytest_cache"}
      - task: _rimraf
        vars: {RIMRAF_TARGET: ".venv"}
      - task: uv:clean
  default:
    desc: Run validate
    cmds:
      - task: validate
  uv:
    desc: Run uv
    interactive: true
    cmds:
      - "uv {{.CLI_ARGS}}"
  cli:
    desc: Run cli
    interactive: true
    cmds:
      - "{{.RUN_PREFIX}} signalsmith {{.CLI_ARGS}}"
  venv:run:
    desc: Run args in the venv
    interactive: true
    cmds:
      - "{{.RUN_PREFIX}} {{.CLI_ARGS}}"
  venv:python:
    desc: Run python in the venv
    interactive: true
    cmds:
      - "{{.RUN_PYTHON}} {{.CLI_ARGS}}"
  _rimraf:
    # This task is a utility task for recursively removing directories, it is
    # similar to rm -rf but not identical and it should work wherever there is
    # a python interpreter. The name is inspired by
    # <https://www.npmjs.com/package/rimraf>.
    - cmd: |
        {{.PYTHON}} -c '
        from pathlib import Path;
        import sys, shutil;
        for path in sys.argv[1:]:
          if Path(path).exists():
            sys.stderr.write(f"removing {path}\n")
            shutil.rmtree(path, ignore_errors=True)
        ' {{.RIMRAF_TARGET}}
#
