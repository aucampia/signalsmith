# signalsmith configuration
# Auto-dismiss GitHub notification spam, alert only on what matters
version: '5.0'
# Seconds between re-notifications for persistent unread items
renotify_interval: 3600
# Seconds between polls in daemon mode. This is a lower bound - signalsmith
# also honors GitHub's X-Poll-Interval response header as a floor, so
# it won't poll faster than GitHub asks even with a lower value here.
poll_interval: 60
# Default action for unmatched notifications
# "notify" = alert by default, write ignore rules for spam
# "ignore" = silent by default, write notify rules for important items
default_action: notify
notify_actions: {}
# Generic notice computed for every notification; reviewer_or_assignee below
# uses it verbatim via `notify: {}`.
notice:
  title: '{{ notification.subject.title }}'
  body: '{{ notification.repository.full_name }} ({{ notification.reason }})'
# Organization filtering (optional)
# masks:
#   orgs:
#     include:
#       - example-corp
#       - example-labs
variables:
  # Repos for which notifications are relevant to me, even if I'm not a
  # direct assignee or reviewer. Always notify.
  ontopic:
    prefixes:
      - example-corp/proj-1234-
    repos:
      - example-labs/widget-backend
  # Repos for which notifications are not relevant to me unless I'm a
  # direct assignee or reviewer. Mark as read.
  offtopic:
    prefixes:
      - example-platform/infra-
      - example-platform/net-
      - example-platform/sec-
    repos:
      - example-platform/prod-shared
      - example-platform/vpn-certs
      - example-oss/some-library
  # Bots which create PRs that are not relevant to me. Mark as read.
  spam_bots:
    - dependabot[bot]
    - release-bot[bot]
  # Teams which does not signify a clear review request. If a PR only
  # requests review from these teams and no other teams, mark as read.
  spam_teams:
    - {org: example-corp, slug: deploy-bots}
    - {org: example-platform, slug: team-cloud}
    - {org: example-platform, slug: team-sre}
rules:
  # Always notify me when I'm explicitly an assignee or requested
  # reviewer. (team/CODEOWNERS-based review requests don't count - only
  # direct.)
  - id: reviewer_or_assignee
    expression: >
      notification.subject.type in ["Issue", "PullRequest"]
      and (
        account.github.username in (
          (subject.assignees + subject.requested_reviewers|default([]))
          | map(attribute='login')
        )
      )
    action:
      notify: {}
  # Always notify me for PRs from ontopic repos, even if I'm not a
  # direct assignee/reviewer.
  - id: on_topic_notify
    expression: >
      (
        variables.get('ontopic', {}).get('prefixes', [])
        | select('startingwith', notification.repository.full_name)
        | first is defined
      )
      or (notification.repository.full_name
          in variables.get('ontopic', {}).get('repos', []))
    action:
      notify: {}
  # Mark notifications as read if the PR is closed or merged, since it's
  # no longer relevant.
  - id: closed_pr_mark_as_read
    expression: >
      notification.subject.type == "PullRequest"
      and (subject.merged or subject.state == "closed")
    action:
      mark_as_read: {}
  # Mark notifications as read if they only request review from spam
  # teams and no other teams.
  - id: spam_team_mark_as_read
    expression: >
      notification.subject.type == "PullRequest"
      and (
        subject.requested_teams and (
          subject.requested_teams
          | rejectattr('slug', 'in',
              variables.get('spam_teams', [])
              | selectattr('org', 'eq', notification.repository.org)
              | map(attribute='slug')
              | list
            )
          | first is undefined
        )
      )
    action:
      mark_as_read: {}
  # Mark PRs from some bots as read, since they are not relevant to me.
  - id: bot_pr_mark_as_read
    expression: >
      notification.subject.type == "PullRequest"
      and (subject.user.login in variables.get('spam_bots', []))
    action:
      mark_as_read: {}
  # Mark PRs from known off-topic repos as read.
  - id: off_topic_mark_as_read
    expression: >
      (
        variables.get('offtopic', {}).get('prefixes', [])
        | select('startingwith', notification.repository.full_name)
        | first is defined
      )
      or (notification.repository.full_name
          in variables.get('offtopic', {}).get('repos', []))
    action:
      mark_as_read: {}
