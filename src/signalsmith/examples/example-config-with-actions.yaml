# Example configuration with reusable action definitions

# Config file schema version (see AGENTS.md for the versioning policy)
version: '1.1'

# Seconds between re-notifications for persistent unread items (default: 3600)
renotify_interval: 3600

# Seconds between polls in daemon mode (default: 300)
poll_interval: 300

# Default action for unmatched notifications (default: notify)
default_action: notify

# Define reusable actions
actions:
  notify_pr:
    notify:
      title: 'PR: ${notification.subject.title}'
      message: 'Reason: ${notification.reason}'

  notify_issue:
    notify:
      title: 'Issue: ${notification.subject.title}'
      message: 'Reason: ${notification.reason}'

  ignore_silently:
    ignore: {}

  mark_read:
    mark_as_read: {}

rules:
  # Use action reference
  - id: 'pr_assigned'
    expression: 'notification.subject.type == "PullRequest" && notification.reason == "assign"'
    action:
      ref: notify_pr

  # Use action reference
  - id: 'issue_mention'
    expression: 'notification.subject.type == "Issue" && notification.reason == "mention"'
    action:
      ref: notify_issue

  # Use ignore action reference - no alert, stays unread
  - id: 'dependabot_prs'
    expression: 'notification.subject.type == "PullRequest" && notification.subject.title.contains("dependabot")'
    action:
      ref: ignore_silently

  # Inline action (still supported) - mark as read on GitHub
  - id: 'release_notifications'
    expression: 'notification.subject.type == "Release"'
    action:
      mark_as_read: {}
