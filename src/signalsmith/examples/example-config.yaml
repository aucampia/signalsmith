# Example configuration for signalsmith
# Place this at ${XDG_CONFIG_HOME}/signalsmith/config.yaml
# (typically ~/.config/signalsmith/config.yaml)
# Or set SIGNALSMITH_CONFIG=/path/to/your/config.yaml

# Config file schema version (see AGENTS.md for the versioning policy)
version: '2.0'

# Seconds between re-notifications for persistent unread items (default: 3600)
renotify_interval: 3600

# Seconds between polls in daemon mode (default: 300)
poll_interval: 300

# Default action for notifications that don't match any rule (default: notify)
# Options:
#   - "notify": Send desktop notification for unmatched items (alert-by-default approach)
#   - "ignore": Silently ignore unmatched items (whitelist approach, only alert on matched rules)
default_action: notify

# Generic notice computed for every notification (Jinja templates - see
# doc/config.md#notices-and-templates). `notify: {}` below uses this verbatim;
# a rule's `notify.title`/`notify.body` can also reference it as
# `{{ notice.title }}`/`{{ notice.body }}`.
notice:
  title: '{{ notification.subject.type }}: {{ notification.subject.title }}'
  body: '{{ notification.repository.full_name }} ({{ notification.reason }})'

rules:
  # Notify on issue mentions
  - id: 'issue_mention'
    expression: 'notification.subject.type == "Issue" && notification.reason == "mention"'
    action:
      notify:
        title: 'GitHub Issue Mention'
        body: 'You were mentioned in: {{ notification.subject.title }}'

  # Notify on issues assigned to you (two-stage filtering with subject fetch).
  # `subject_expression` already fetched `subject` for matching, so the
  # `notify` template can reference it too, at no extra cost.
  - id: 'issue_assigned_to_me'
    expression: 'notification.subject.type == "Issue"'
    subject_expression: 'subject.assignees.exists(a, a.login == account.github.username)'
    action:
      notify:
        title: 'Issue Assigned to You'
        body: 'You were assigned: {{ notification.subject.title }} (state: {{ subject.state }})'

  # Notify on PR review requests where you're specifically requested (two-stage filtering)
  - id: 'pr_review_requested_to_me'
    expression: 'notification.subject.type == "PullRequest" && notification.reason == "review_requested"'
    subject_expression: 'subject.requested_reviewers.exists(r, r.login == account.github.username)'
    action:
      notify:
        title: 'PR Review Request'
        body: 'Review requested: {{ notification.subject.title }}'

  # Ignore draft PRs (two-stage filtering) - no alert, stays unread
  - id: 'draft_pr_ignore'
    expression: 'notification.subject.type == "PullRequest"'
    subject_expression: 'subject.draft == true'
    action:
      ignore: {}

  # Notify on PR review requests (generic fallback) - uses the top-level
  # `notice:` verbatim, no per-rule title/body needed.
  - id: 'pr_review_request'
    expression: 'notification.subject.type == "PullRequest" && notification.reason == "review_requested"'
    action:
      notify: {}

  # Ignore noisy repositories - no alert, stays unread
  - id: 'noisy_repo_ignore'
    expression: 'notification.repository.full_name == "my-org/noisy-repo"'
    action:
      ignore: {}

  # Mark CI activity as read - no alert, marked as read on GitHub
  - id: 'ci_activity_dismiss'
    expression: 'notification.reason == "ci_activity"'
    action:
      mark_as_read: {}

  # Notify on all other PR notifications - generic notice again
  - id: 'pr_other'
    expression: 'notification.subject.type == "PullRequest"'
    action:
      notify: {}

  # Mark release notifications as read - completely dismiss from GitHub
  - id: 'release_dismiss'
    expression: 'notification.subject.type == "Release"'
    action:
      mark_as_read: {}
